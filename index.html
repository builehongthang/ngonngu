<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bé Khám Phá Thế Giới - Kéo Thả Lời Chào</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700;800&family=Noto+Sans+JP:wght@700&family=Noto+Sans+KR:wght@700&family=Noto+Sans+SC:wght@700&display=swap" rel="stylesheet">
  <!-- Thư viện hiệu ứng pháo hoa giấy và âm thanh Tone.js -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #E0F2FE 0%, #BAE6FD 100%);
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --border-blue: #38BDF8;
      --accent-yellow: #FEF08A;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Comfortaa', 'Noto Sans JP', 'Noto Sans KR', 'Noto Sans SC', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Tiêu đề & Bảng điểm */
    header {
      text-align: center;
      margin-bottom: 6px;
    }

    .title {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      color: #0284C7;
      text-shadow: 1px 1px 0px #FFF;
    }

    .sub-title {
      margin-top: 4px;
      font-size: 15px;
      color: #0369A1;
      font-weight: 700;
    }

    .score-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 800;
      color: #D97706;
      border: 2px solid #FCD34D;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.15);
      margin-top: 6px;
    }

    .word-stage {
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
      width: 100%;
    }

    .draggable-word {
      background: var(--accent-yellow);
      border: 4px dashed #F59E0B;
      padding: 16px 42px;
      border-radius: 999px;
      font-size: 32px;
      font-weight: 800;
      color: #B45309;
      cursor: grab;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.28);
      transition: transform 0.15s ease, background 0.2s, box-shadow 0.2s;
      touch-action: none;
      letter-spacing: 1px;
    }

    .draggable-word:active,
    .draggable-word.dragging {
      cursor: grabbing;
      transform: scale(1.08);
      box-shadow: 0 12px 24px rgba(245, 158, 11, 0.35);
    }

    .country-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 740px;
      margin-bottom: 12px;
    }

    .country-card {
      background: #FFFFFF;
      border: 3px solid #E2E8F0;
      border-radius: 22px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(148, 163, 184, 0.18);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .flag-box {
      width: 100px;
      height: 66px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
      border: 1px solid #E2E8F0;
      margin-bottom: 8px;
      pointer-events: none;
      display: flex;
    }

    .flag-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .country-name {
      font-size: 16px;
      font-weight: 800;
      color: #1E293B;
      pointer-events: none;
    }

    .country-card.drag-target-hover {
      border-color: var(--border-blue);
      background: #F0F9FF;
      transform: scale(1.05);
    }

    .country-card.pop-correct {
      animation: popGreen 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: #ECFDF5;
      border-color: #34D399;
    }

    .draggable-word.shake-wrong {
      animation: shake 0.45s ease;
      background: #FEE2E2;
      border-color: #EF4444;
      color: #B91C1C;
    }

    @keyframes popGreen {
      0% { transform: scale(1); }
      40% { transform: scale(1.12) rotate(2deg); }
      70% { transform: scale(0.96) rotate(-1deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-12px); }
      40%, 80% { transform: translateX(12px); }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .popup-box {
      background: #FFFFFF;
      border: 4px solid #FBBF24;
      border-radius: 28px;
      padding: 26px 28px 22px;
      width: 100%;
      max-width: 430px;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.22);
      transform: scale(0.7) translateY(20px);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .modal-overlay.open .popup-box {
      transform: scale(1) translateY(0);
    }

    .btn-close-x {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #F1F5F9;
      border: 2px solid #CBD5E1;
      color: #64748B;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      line-height: 1;
    }

    .btn-close-x:hover {
      background: #FEE2E2;
      border-color: #F87171;
      color: #EF4444;
      transform: scale(1.1) rotate(90deg);
    }

    .popup-praise {
      font-size: 24px;
      font-weight: 800;
      color: #D97706;
      margin-bottom: 14px;
    }

    .trans-card {
      background: #F8FAFC;
      border: 2px dashed #93C5FD;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .trans-word {
      font-size: 34px;
      font-weight: 800;
      color: #B45309;
      line-height: 1.2;
    }

    .trans-phonetic {
      font-size: 15px;
      color: #64748B;
      font-weight: 700;
      font-style: italic;
    }

    .trans-meaning {
      font-size: 19px;
      font-weight: 800;
      color: #0284C7;
      margin-top: 4px;
    }

    .trans-country {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #E0F2FE;
      color: #0369A1;
      font-weight: 700;
      font-size: 14px;
      padding: 4px 12px;
      border-radius: 999px;
      margin-top: 4px;
    }

    .btn-continue {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 999px;
      padding: 12px 32px;
      font-size: 17px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(16, 185, 129, 0.35);
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-continue:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 8px 18px rgba(16, 185, 129, 0.45);
    }

    @media (max-width: 600px) {
      .country-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .flag-box {
        width: 80px;
        height: 52px;
      }
      .title {
        font-size: 22px;
      }
      .draggable-word {
        font-size: 26px;
        padding: 12px 32px;
      }
      .country-name {
        font-size: 15px;
      }
      .popup-box {
        padding: 22px 18px 18px;
      }
      .trans-word {
        font-size: 28px;
      }
      .trans-meaning {
        font-size: 17px;
      }
    }
  </style>
</head>

    function playSound(type) {
      try {
        if (!synth && window.Tone) {
          synth = new Tone.PolySynth(Tone.Synth).toDestination();
          synth.volume.value = -6;
        }
        if (window.Tone && Tone.context.state !== 'running') {
          Tone.start();
        }

        if (synth) {
          if (type === 'correct') {
            synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "8n");
          } else if (type === 'wrong') {
            synth.triggerAttackRelease(["D3", "Bb2"], "16n");
          }
        }
      } catch (e) {
        // Dự phòng im lặng nếu trình duyệt giới hạn audio
      }
    }

    const wordStage = document.getElementById("wordStage");
    const countryGrid = document.getElementById("countryGrid");
    const scoreText = document.getElementById("scoreText");

    const popupModal = document.getElementById("popupModal");
    const popupPraise = document.getElementById("popupPraise");
    const popupWord = document.getElementById("popupWord");
    const popupPhonetic = document.getElementById("popupPhonetic");
    const popupMeaning = document.getElementById("popupMeaning");
    const popupCountry = document.getElementById("popupCountry");
    const btnCloseX = document.getElementById("btnCloseX");
    const btnContinue = document.getElementById("btnContinue");

    function initZones() {
      countryGrid.innerHTML = "";
      COUNTRIES.forEach(item => {
        const card = document.createElement("div");
        card.className = "country-card";
        card.dataset.id = item.id;
        card.innerHTML = `
          <div class="flag-box">${FLAGS_SVG[item.id]}</div>
          <div class="country-name">${item.name}</div>
        `;

        card.addEventListener("dragover", (e) => {
          e.preventDefault();
          if (!isModalOpen) card.classList.add("drag-target-hover");
        });

        card.addEventListener("dragleave", () => {
          card.classList.remove("drag-target-hover");
        });

        card.addEventListener("drop", (e) => {
          e.preventDefault();
          card.classList.remove("drag-target-hover");
          if (!isModalOpen) {
            checkAnswer(card.dataset.id, card);
          }
        });

        countryGrid.appendChild(card);
      });
    }

    function spawnNextWord() {
      if (pool.length === 0) {
        pool = [...VOCABULARY];
      }

      let nextIndex = Math.floor(Math.random() * pool.length);
      if (currentItem && pool.length > 1 && pool[nextIndex].word === currentItem.word) {
        nextIndex = (nextIndex + 1) % pool.length;
      }

      currentItem = pool.splice(nextIndex, 1)[0];
      wordStage.innerHTML = "";

      const wordEl = document.createElement("div");
      wordEl.className = "draggable-word";
      wordEl.textContent = currentItem.word;
      wordEl.draggable = true;

      wordEl.addEventListener("dragstart", (e) => {
        if (isModalOpen) {
          e.preventDefault();
          return;
        }
        wordEl.classList.add("dragging");
        e.dataTransfer.setData("text/plain", currentItem.countryId);
      });

      wordEl.addEventListener("dragend", () => {
        wordEl.classList.remove("dragging");
      });

      setupTouchDrag(wordEl);
      wordStage.appendChild(wordEl);
    }

    function checkAnswer(chosenId, targetCard) {
      if (isModalOpen || !currentItem) return;

      const wordEl = wordStage.querySelector(".draggable-word");

      if (chosenId === currentItem.countryId) {
        // ĐÚNG:
        isModalOpen = true;
        activeCardElem = targetCard;
        score += 10;
        scoreText.textContent = score;

        playSound('correct');
        targetCard.classList.add("pop-correct");

        if (window.confetti) {
          confetti({
            particleCount: 65,
            spread: 75,
            origin: { y: 0.6 }
          });
        }

        const randomPraise = praises[Math.floor(Math.random() * praises.length)];
        popupPraise.textContent = randomPraise;
        popupWord.textContent = currentItem.word;
        popupPhonetic.textContent = `Phiên âm: ${currentItem.phonetic}`;
        popupMeaning.textContent = `Nghĩa là: "${currentItem.meaning}"`;
        
        const matchedCountry = COUNTRIES.find(c => c.id === currentItem.countryId);
        popupCountry.textContent = `${matchedCountry ? matchedCountry.icon : '🌍'} ${currentItem.countryName}`;

        popupModal.classList.add("open");
      } else {
        // SAI:
        playSound('wrong');
        if (wordEl) {
          wordEl.classList.add("shake-wrong");
          setTimeout(() => {
            wordEl.classList.remove("shake-wrong");
          }, 450);
        }
      }
    }

    function closeModalAndNext() {
      if (!isModalOpen) return;
      popupModal.classList.remove("open");
      
      if (activeCardElem) {
        activeCardElem.classList.remove("pop-correct");
        activeCardElem = null;
      }

      isModalOpen = false;
      setTimeout(spawnNextWord, 200);
    }

    btnCloseX.addEventListener("click", closeModalAndNext);
    btnContinue.addEventListener("click", closeModalAndNext);

    function setupTouchDrag(el) {
      let startX, startY;
      let activeHoverCard = null;

      el.addEventListener("touchstart", (e) => {
        if (isModalOpen) return;
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        el.classList.add("dragging");
      }, { passive: true });

      el.addEventListener("touchmove", (e) => {
        if (isModalOpen) return;
        const touch = e.touches[0];
        const deltaX = touch.clientX - startX;
        const deltaY = touch.clientY - startY;

        el.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(1.1)`;

        el.style.visibility = "hidden";
        const underElement = document.elementFromPoint(touch.clientX, touch.clientY);
        el.style.visibility = "visible";

        const hoveredCard = underElement ? underElement.closest(".country-card") : null;
        if (activeHoverCard && activeHoverCard !== hoveredCard) {
          activeHoverCard.classList.remove("drag-target-hover");
        }
        if (hoveredCard) {
          hoveredCard.classList.add("drag-target-hover");
          activeHoverCard = hoveredCard;
        } else {
          activeHoverCard = null;
        }
      }, { passive: true });

      el.addEventListener("touchend", (e) => {
        if (isModalOpen) return;
        const touch = e.changedTouches[0];
        el.style.visibility = "hidden";
        const dropElement = document.elementFromPoint(touch.clientX, touch.clientY);
        el.style.visibility = "visible";

        el.style.transform = "";
        el.classList.remove("dragging");

        if (activeHoverCard) {
          activeHoverCard.classList.remove("drag-target-hover");
          activeHoverCard = null;
        }

        const finalCard = dropElement ? dropElement.closest(".country-card") : null;
        if (finalCard) {
          checkAnswer(finalCard.dataset.id, finalCard);
        }
      });
    }

    initZones();
    spawnNextWord();
  </script>
</body>
</html>
